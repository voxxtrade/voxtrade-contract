[package]
name = "agent_treasury"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = "=20.0.0"
arbitrary = "=1.3.2"
derive_arbitrary = "=1.3.2"

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
agent_treasury = { path = ".", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]

[lib]
crate-type = ["cdylib", "rlib"]
