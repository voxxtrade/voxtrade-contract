name: Rust Soroban CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
          components: rustfmt
      - name: Fix Dependencies
        run: cargo generate-lockfile && cargo update -p zeroize --precise 1.8.1 && cargo update -p ed25519-dalek --precise 2.1.1
      - name: Check Formatting
        run: cargo fmt --all -- --check

  lint:
    name: Clippy Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
          components: clippy
      - name: Fix Dependencies
        run: cargo generate-lockfile && cargo update -p zeroize --precise 1.8.1 && cargo update -p ed25519-dalek --precise 2.1.1
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: wasm32-unknown-unknown
      - name: Fix Dependencies
        run: cargo generate-lockfile && cargo update -p zeroize --precise 1.8.1 && cargo update -p ed25519-dalek --precise 2.1.1
      - name: Build Contracts
        run: cargo build --target wasm32-unknown-unknown --release
      - name: Run Tests
        run: cargo test
